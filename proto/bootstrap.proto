syntax = "proto3";

package axiom.bootstrap.v1;

option go_package = "github.com/axiom/axiom-agent/pkg/api/bootstrap/v1";

// BootstrapService handles the initial onboarding of a Axiom Agent.
service BootstrapService {
  // Bootstrap is the initial call to exchange a join token for a signed certificate.
  // This call is typically made over standard TLS before mTLS is established.
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
}

message BootstrapRequest {
  // Join token generated by the Axiom Center.
  string token = 1;
  // PEM encoded Certificate Signing Request (CSR).
  string csr = 2;
  // Unique identifier for the node (e.g., hardware UUID or hostname).
  string node_id = 3;
}

message BootstrapResponse {
  // PEM encoded signed client certificate.
  string certificate = 1;
  // PEM encoded CA certificate to allow the Agent to verify the Center's identity in future mTLS calls.
  string ca_certificate = 2;
}
